name: SPGD-site Pages landing policy

on:
  pull_request:
    paths:
      - "pages-gateway-tests/**"
      - ".github/workflows/laps-gateway-tests.yml"
      - ".github/workflows/pages.yml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "next.config.mjs"
  push:
    branches: [main]
    paths:
      - "pages-gateway-tests/**"
      - ".github/workflows/laps-gateway-tests.yml"
      - ".github/workflows/pages.yml"
      - "src/**"
      - "public/**"
      - "package.json"
      - "next.config.mjs"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy GitHub Pages"
    types:
      - completed

permissions:
  contents: read

jobs:
  spgd-pages-landing-gate:
    name: SPGD-site Pages landing (Playwright)
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pages-gateway-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pages-gateway-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run SPGD-site landing policy suite
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spgd-pages-landing-playwright-report
          path: |
            pages-gateway-tests/playwright-report/
            pages-gateway-tests/test-results/
          if-no-files-found: warn
