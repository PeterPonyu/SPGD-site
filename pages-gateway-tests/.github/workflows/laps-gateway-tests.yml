name: SPGD-site Pages landing policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spgd-pages-landing-gate:
    name: SPGD-site Pages landing (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pages-gateway-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pages-gateway-tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run SPGD-site landing policy suite
        run: npm test
